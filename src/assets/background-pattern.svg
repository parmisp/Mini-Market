<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hexagonal pattern -->
    <pattern id="hexPattern" x="0" y="0" width="100" height="87" patternUnits="userSpaceOnUse">
      <path d="M50 0 L75 25 L75 50 L50 75 L25 50 L25 25 Z" 
            fill="none" 
            stroke="rgba(34, 197, 94, 0.08)" 
            stroke-width="1"/>
    </pattern>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Radial gradient for subtle depth -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base layer -->
  <rect width="1920" height="1080" fill="#0f172a"/>
  
  <!-- Hexagonal pattern -->
  <rect width="1920" height="1080" fill="url(#hexPattern)" opacity="0.12"/>
  
  <!-- Gradient overlay for depth -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Subtle glowing dots at intersections -->
  <circle cx="300" cy="200" r="2" fill="#22c55e" opacity="0.15" filter="url(#glow)"/>
  <circle cx="800" cy="400" r="2" fill="#22c55e" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1400" cy="600" r="2" fill="#22c55e" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1600" cy="300" r="2" fill="#22c55e" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="800" r="2" fill="#22c55e" opacity="0.15" filter="url(#glow)"/>
</svg>
